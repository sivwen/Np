name: tmp-elin-luck-v370-build
on:
  push:
    branches: ["tmp-elin-elona-luck-v370-20260905"]
jobs:
  build:
    if: ${{ github.event.head_commit.message != 'Apply v3.7 fishing rewards and flavor log' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-elin-elona-luck-v370-20260905
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply v3.7 source changes
        run: python -c "import base64;exec(base64.b64decode(' uTWF4KDEsX19yZXN1bHQtc2F2ZWQpOycsICdpZihzYXZlZD4wKXt ©©©sri4jri6QuIik7CiAgICAgICAgTHVja0NhcD1QbHVnaW4uSS5Db25maWcuQmluZCgi64Kc6rCAIOyatCIsIu2WiOqwkCDrs7Tsg4Eg7IOB64yAIOuztOuEiOyKpCDsg4DtlZwiLDEwMCwi7Z2s6rSAIOuztOyDgCDsg4DrjIDtmZXquYTrp4wg7¦lIOqwkOydmCDsg4DtlZjsnYQg64KY64uk64uI64ukLiIpOwogICAgICAgIHJldHVybiB0cnVlOwogICAgfQoKICAgIHN0YXRpYyBib29sIElzTGRjKENvZGVJbnN0cnVjdGlvbiBjLGludCB2KQogICAgewogICAgICAgIGlmKGMub3Bjb2RlPT1PcENvZGVzLkxkY19JNClyZXR1cm4gYy5vcGVyYW5kIGlzIGludCB4JiZ4PT12OwogICAgICAgIGlmKGMub3Bjb2RlPT1PcENvZGVzLkxkY19JNF9T '))"
      - name: Safety audit
        run: |
          SRC=_tmp/ElonaLuckForElinV3/Plugin.cs
          ! grep -F 'HarmonyPatch(typeof(Card),nameof(Card.SpawnLoot)' "$SRC"
          ! grep -F 'HarmonyPatch(typeof(Card),nameof(Card.Die)' "$SRC"
          ! grep -F 'PatchAll()' "$SRC"
          ! grep -F 'StackTrace' "$SRC"
          ! grep -F 'HarmonyPatch(typeof(Map),nameof(Map.TrySmoothPick)' "$SRC"
          grep -F 'FishRareRewardPatch' "$SRC"
          grep -F 'Msg.SayRaw("손끝에 행운이 스쳤다.' "$SRC"
      - run: dotnet build _tmp/ElonaLuckForElinV3/ElonaLuckForElinV3.csproj -c Release
      - name: Commit v3.7 source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _tmp/ElonaLuckForElinV3
          git commit -m 'Apply v3.7 fishing rewards and flavor log' || true
          git push origin HEAD:tmp-elin-elona-luck-v370-20260905
      - name: Package
        run: |
          mkdir -p artifact/ElonaLuckForElin
          cp _tmp/ElonaLuckForElinV3/bin/Release/netstandard2.0/ElonaLuckForElin.dll artifact/ElonaLuckForElin/
          cp _tmp/ElonaLuckForElinV3/package.xml artifact/ElonaLuckForElin/
          cp _tmp/ElonaLuckForElinV3/README_KR.md artifact/ElonaLuckForElin/
      - uses: actions/upload-artifact@v4
        with:
          name: ElonaLuckForElin-v3.7
          path: artifact/ElonaLuckForElin
