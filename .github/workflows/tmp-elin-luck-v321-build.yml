name: tmp-elin-luck-v321-build
on:
  push:
    branches: ["tmp-elin-elona-luck-v321-20260907"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply v3.21 transform
        run: python _tmp/build_v321.py
      - name: Safety and diagnostic audit
        run: |
          set -eu
          P=_tmp/ElonaLuckForElinV3/Plugin.cs
          ! grep -q 'HarmonyPatch(typeof(Card),nameof(Card.DamageHP)' "$P"
          ! grep -q 'HarmonyPatch(typeof(Card),nameof(Card.Die)' "$P"
          ! grep -q 'HarmonyPatch(typeof(Card),nameof(Card.SpawnLoot)' "$P"
          ! grep -q 'HarmonyPatch(typeof(Thing),nameof(Thing.OnCreate)' "$P"
          ! grep -q 'HarmonyPatch(typeof(ThingGen)' "$P"
          ! grep -q '\.PatchAll()' "$P"
          ! grep -q 'StackTrace' "$P"
          grep -q '\[PATCH-BEGIN\]' "$P"
          grep -q '\[PATCH-OK\]' "$P"
          grep -q '\[PATCH-FAIL\]' "$P"
          grep -q 'ex.ToString()' "$P"
          grep -q '<version>0.23.338</version>' _tmp/ElonaLuckForElinV3/package.xml
      - name: Build
        run: dotnet build _tmp/ElonaLuckForElinV3/ElonaLuckForElinV3.csproj -c Release
      - name: Package
        run: |
          mkdir -p artifact/ElonaLuckForElin
          cp _tmp/ElonaLuckForElinV3/bin/Release/netstandard2.0/ElonaLuckForElin.dll artifact/ElonaLuckForElin/
          cp _tmp/ElonaLuckForElinV3/package.xml artifact/ElonaLuckForElin/
          cp _tmp/ElonaLuckForElinV3/README_KR.md artifact/ElonaLuckForElin/
      - uses: actions/upload-artifact@v4
        with:
          name: ElonaLuckForElin-v3.21-PatchIsolationDiagnostic
          path: artifact/ElonaLuckForElin
