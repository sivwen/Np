name: tmp-elin-luck-v350-build
on:
  push:
    branches: ["tmp-elin-elona-luck-v350-20260905"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - name: Safety audit
        run: |
          ! grep -q 'nameof(Card.SpawnLoot)' _tmp/ElonaLuckForElinV3/Plugin.cs
          ! grep -q 'PatchAll' _tmp/ElonaLuckForElinV3/Plugin.cs
          ! grep -q 'System.Diagnostics' _tmp/ElonaLuckForElinV3/Plugin.cs
      - run: dotnet build _tmp/ElonaLuckForElinV3/ElonaLuckForElinV3.csproj -c Release
      - name: Package
        run: |
          mkdir -p artifact/ElonaLuckForElin
          cp _tmp/ElonaLuckForElinV3/bin/Release/netstandard2.0/ElonaLuckForElin.dll artifact/ElonaLuckForElin/
          cp _tmp/ElonaLuckForElinV3/package.xml artifact/ElonaLuckForElin/
          cp _tmp/ElonaLuckForElinV3/README_KR.md artifact/ElonaLuckForElin/
      - uses: actions/upload-artifact@v4
        with:
          name: ElonaLuckForElin-v3.5
          path: artifact/ElonaLuckForElin