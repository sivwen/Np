name: tmp-elin-luck-v319-build
on:
  push:
    branches: ["tmp-elin-elona-luck-v319-20260906"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply v3.19 transform
        run: python _tmp/build_v319.py
      - name: Safety/performance audit
        run: |
          set -eu
          P=_tmp/ElonaLuckForElinV3/Plugin.cs
          ! grep -q 'HarmonyPatch(typeof(Card),nameof(Card.Die)' "$P"
          ! grep -q 'HarmonyPatch(typeof(Card),nameof(Card.SpawnLoot)' "$P"
          ! grep -q 'HarmonyPatch(typeof(Thing),nameof(Thing.OnCreate)' "$P"
          ! grep -q 'HarmonyPatch(typeof(ThingGen)' "$P"
          ! grep -q 'HarmonyPatch(typeof(Card),nameof(Card.DamageHP)' "$P"
          ! grep -q 'ConditionalWeakTable' "$P"
          ! grep -q 'LastDamageAttribution' "$P"
          ! grep -q 'RecentDamageTTL' "$P"
          ! grep -q 'StackTrace' "$P"
          ! grep -q '\.PatchAll()' "$P"
          ! grep -q 'FinishKillContext' "$P"
          grep -q 'DeathLuckMode' "$P"
          grep -q '파티최고' "$P"
          grep -q '파티합산' "$P"
          grep -q 'TryResolveDirect' "$P"
          grep -q 'AttackProcess.Current' "$P"
          grep -q 'DamageHP Harmony 패치 없음' "$P"
          grep -q 'LuckyFishingReplacementPatch' "$P"
          grep -q 'GoldenFishLuckPatch' "$P"
          grep -q 'MonsterEquipContextPatch' "$P"
      - run: dotnet build _tmp/ElonaLuckForElinV3/ElonaLuckForElinV3.csproj -c Release
      - name: Package
        run: |
          mkdir -p artifact/ElonaLuckForElin
          cp _tmp/ElonaLuckForElinV3/bin/Release/netstandard2.0/ElonaLuckForElin.dll artifact/ElonaLuckForElin/
          cp _tmp/ElonaLuckForElinV3/package.xml artifact/ElonaLuckForElin/
          cp _tmp/ElonaLuckForElinV3/README_KR.md artifact/ElonaLuckForElin/
      - uses: actions/upload-artifact@v4
        with:
          name: ElonaLuckForElin-v3.19-PerformanceSafe
          path: artifact/ElonaLuckForElin
